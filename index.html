<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">

    <title>GMG – Outlook megnyitása</title>

    <style>
        body {
            margin: 0;
            background: #101b2b;
            color: #edf4ff;
            font: 17px/1.6 system-ui, sans-serif;
            display: grid;
            min-height: 100vh;
            place-items: center;
        }

        main {
            max-width: 480px;
            padding: 28px;
        }

        a {
            display: block;
            background: #1684df;
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            margin: 20px 0;
        }

        small {
            color: #bccbe0;
        }
    </style>
</head>

<body>
    <main>
        <a id="open" href="ms-outlook://">
            Outlook alkalmazás megnyitása
        </a>

        <p>Ha nem történik semmi, koppints a fenti gombra, és engedélyezd az alkalmazás megnyitását, ha a telefon rákérdez</p>

        <small>Csak az Outlookot indítja, nem egy adott levelet. Ha az Outlook nincs telepítve, a link nem indít alkalmazást.</small>
    </main>

    <script>
        (() => {
            let timer = setTimeout(() => {
                timer = null;

                if (document.visibilityState === 'visible') {
                    window.location.href = 'ms-outlook://';
                }
            }, 800);

            function cancelAutomaticOpen() {
                if (timer !== null) {
                    clearTimeout(timer);
                    timer = null;
                }
            }

            document.getElementById('open').addEventListener(
                'click',
                cancelAutomaticOpen
            );

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    cancelAutomaticOpen();
                }
            });
        })();
    </script>
</body>
</html>
